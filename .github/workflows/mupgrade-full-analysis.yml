name: Full M-UPGRADE analysis

on:
  push:
    branches:
      - "analysis/mupgrade-full"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract complete package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, shutil
          z=zipfile.ZipFile("m upgrade.zip")
          out=Path("mupgrade_full")
          if out.exists(): shutil.rmtree(out)
          out.mkdir()
          for info in z.infolist():
              safe=info.filename.replace("\\","/")
              target=out/safe
              target.parent.mkdir(parents=True, exist_ok=True)
              if info.is_dir():
                  target.mkdir(parents=True, exist_ok=True)
              else:
                  target.write_bytes(z.read(info))
          print("entries:", len(z.infolist()))
          print("compressed:", Path("m upgrade.zip").stat().st_size)
          PY

      - name: Static analysis
        run: |
          python3 -m pip install --disable-pip-version-check pefile capstone
          cat > analyze.py <<'PY'
          from pathlib import Path
          import re, hashlib, json, zipfile
          import pefile

          root=Path("mupgrade_full")
          out=Path("analysis")
          out.mkdir(parents=True,exist_ok=True)

          def sha(p):
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for b in iter(lambda:f.read(1024*1024),b""): h.update(b)
              return h.hexdigest()

          files=[]
          for p in root.rglob("*"):
              if p.is_file():
                  files.append((str(p.relative_to(root)),p.stat().st_size,sha(p)))
          files.sort()
          with (out/"inventory.tsv").open("w",encoding="utf-8") as f:
              for p,s,h in files: f.write(f"{s}\t{h}\t{p}\n")

          strings_key=re.compile(
              r"midi|sysex|sys.?ex|ota|upgrade|firmware|KPT|TANK|PRO|Sinco|"
              r"E0000000|midiOut|midiIn|longmsg|shortmsg|ack|nak|checksum|crc|"
              r"verify|boot|loader|dfu|device|version|product|model|usb|audio|"
              r"vendor|pid|vid|message|packet|block|transfer|flash",
              re.I)

          def strings_ascii(b,n=4):
              return [(m.start(),m.group().decode("ascii","ignore"))
                      for m in re.finditer(rb"[ -~]{%d,}"%n,b)]
          def strings_utf16(b,n=4):
              pat=rb"(?:[ -~]\x00){%d,}"%n
              ans=[]
              for m in re.finditer(pat,b):
                  try: ans.append((m.start(),m.group().decode("utf-16le","ignore")))
                  except Exception: pass
              return ans

          with (out/"all_relevant_strings.tsv").open("w",encoding="utf-8",errors="ignore") as f:
              for rel,size,h in files:
                  p=root/rel
                  try: data=p.read_bytes()
                  except Exception: continue
                  for off,s in strings_ascii(data)+strings_utf16(data):
                      if strings_key.search(s):
                          f.write(f"{rel}\t0x{off:X}\t{s}\n")

          # PE report for every executable/DLL.
          with (out/"pe_report.txt").open("w",encoding="utf-8",errors="ignore") as f:
              for rel,size,h in files:
                  p=root/rel
                  if p.suffix.lower() not in {".exe",".dll",".ocx"}: continue
                  try:
                      pe=pefile.PE(str(p),fast_load=False)
                      f.write(f"\n===== {rel} ({size} bytes) =====\n")
                      f.write(f"Machine=0x{pe.FILE_HEADER.Machine:X} ImageBase=0x{pe.OPTIONAL_HEADER.ImageBase:X} EP=0x{pe.OPTIONAL_HEADER.AddressOfEntryPoint:X}\n")
                      f.write("Imports:\n")
                      try:
                          for entry in pe.DIRECTORY_ENTRY_IMPORT:
                              dll=entry.dll.decode(errors="ignore")
                              for imp in entry.imports:
                                  nm=imp.name.decode(errors="ignore") if imp.name else f"ord_{imp.ordinal}"
                                  f.write(f"{dll}\t{nm}\n")
                      except Exception as e: f.write("IMPORT_ERROR "+repr(e)+"\n")
                  except Exception as e:
                      f.write(f"\n===== {rel} =====\nNOT_PE {e}\n")

          # Focused EXE metadata and constant scan.
          exe=root/"M-UPGRADE.exe"
          if not exe.exists():
              exes=list(root.rglob("M-UPGRADE.exe"))
              exe=exes[0] if exes else None
          if exe:
              data=exe.read_bytes()
              (out/"exe_hashes.txt").write_text(
                  f"path={exe}\nsize={len(data)}\nSHA256={sha(exe)}\nMD5={hashlib.md5(data).hexdigest()}\n",
                  encoding="utf-8")
              pats={
                  "E0000000_LE":bytes.fromhex("00 00 00 E0"),
                  "E0000000_BE":bytes.fromhex("E0 00 00 00"),
                  "E00000":bytes.fromhex("00 00 E0"),
                  "MIDI":b"MIDI","SysEx":b"SysEx","Sinco":b"Sinco",
                  "KPT":b"KPT","TANK":b"TANK","OTA":b"OTA","upgrade":b"upgrade",
                  "midiOutLongMsg":b"midiOutLongMsg","midiOutShortMsg":b"midiOutShortMsg",
                  "midiInAddBuffer":b"midiInAddBuffer"
              }
              with (out/"exe_byte_hits.txt").open("w") as f:
                  for name,pat in pats.items():
                      pos=[]; i=0
                      while True:
                          i=data.find(pat,i)
                          if i<0: break
                          pos.append(i); i+=1
                      f.write(f"{name}\t{len(pos)}\t"+" ".join(hex(x) for x in pos[:500])+"\n")

              key=re.compile(r"midi|sysex|ota|upgrade|firmware|KPT|TANK|Sinco|E000|ack|nak|checksum|crc|verify|boot|loader|device",re.I)
              with (out/"exe_strings.tsv").open("w",encoding="utf-8",errors="ignore") as f:
                  for off,s in strings_ascii(data)+strings_utf16(data):
                      if key.search(s): f.write(f"0x{off:X}\t{s}\n")

          # AppConfig and logs are extracted verbatim.
          for p in list(root.rglob("*.ini")) + list(root.rglob("*.cfg")) + list(root.rglob("*.conf")):
              try:
                  (out/("config_"+p.name)).write_text(p.read_text("utf-8","replace"),encoding="utf-8")
              except Exception: pass

          lk=re.compile(r"midi|sysex|ota|upgrade|firmware|KPT|TANK|Sinco|E000|error|fail|success|ack|nak|checksum|verify|timeout|device|version|boot|loader|message|packet|block",re.I)
          with (out/"logs_relevant.txt").open("w",encoding="utf-8",errors="ignore") as f:
              for p in sorted(root.rglob("*.log")):
                  try: text=p.read_text("utf-8","replace")
                  except Exception: text=p.read_text(errors="replace")
                  f.write("\n===== "+str(p.relative_to(root))+" =====\n")
                  lines=text.splitlines()
                  for i,line in enumerate(lines):
                      if lk.search(line):
                          for j in range(max(0,i-3),min(len(lines),i+4)):
                              f.write(f"{j+1:6d}: {lines[j]}\n")

          # ZIP member listing, to preserve the original package structure.
          with zipfile.ZipFile("m upgrade.zip") as z:
              with (out/"zip_inventory.txt").open("w",encoding="utf-8") as f:
                  for info in z.infolist():
                      f.write(f"{info.file_size}\t{info.compress_size}\t{info.filename}\n")

          print("Static analysis complete")
          PY
          python3 analyze.py



      - name: Deep OTA code and MIDI byte analysis
        run: |
          python3 -m pip install --disable-pip-version-check pefile capstone
          cat > deep.py <<'PY'
          from pathlib import Path
          import re, pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64, CS_MODE_32, CS_OP_IMM, CS_OP_MEM, X86_REG_RIP

          root=Path("mupgrade_full")
          exe=root/"M-UPGRADE.exe"
          out=Path("analysis")
          data=exe.read_bytes()
          pe=pefile.PE(str(exe),fast_load=False)
          arch=CS_MODE_64 if pe.FILE_HEADER.Machine==0x8664 else CS_MODE_32
          md=Cs(CS_ARCH_X86,arch); md.detail=True

          text=None
          for s in pe.sections:
              if s.Name.rstrip(b"\\0")==b".text": text=s; break
          if not text: raise SystemExit("no .text")
          code=text.get_data()
          base=pe.OPTIONAL_HEADER.ImageBase+text.VirtualAddress

          def ascii_strings(b,n=4):
              return [(m.start(),m.group().decode("ascii","ignore"))
                      for m in re.finditer(rb"[ -~]{%d,}"%n,b)]
          strs=ascii_strings(data)
          rel=[]
          for off,s in strs:
              if re.search(r"OtaUpgradeWorker|Sending upgrade|Verification timeout|Sending data to device|Device request|MIDI preparation|upgrade mode|handshake|M_usb|verification passed|ota-KPTPRO|0xE0000000|isolated MIDI|upgrade completed",s,re.I):
                  rva=None
                  for sec in pe.sections:
                      a=sec.PointerToRawData;b= a+sec.SizeOfRawData
                      if a<=off<b:
                          rva=pe.OPTIONAL_HEADER.ImageBase+sec.VirtualAddress+(off-a);break
                  if rva: rel.append((rva,s,off))

          ins=list(md.disasm(code,base))
          by_addr={i.address:k for k,i in enumerate(ins)}
          with (out/"ota_xrefs.txt").open("w",encoding="utf-8",errors="ignore") as f:
              for target,s,off in rel:
                  f.write(f"\\n### 0x{target:X} {s}\\n")
                  found=0
                  for idx,i in enumerate(ins):
                      tgt=None
                      for op in i.operands:
                          if op.type==CS_OP_MEM and op.mem.base==X86_REG_RIP:
                              tgt=i.address+i.size+op.mem.disp
                          elif op.type==CS_OP_IMM:
                              tgt=op.imm
                          if tgt==target:
                              found+=1
                              f.write(f"ref 0x{i.address:X}: {i.mnemonic} {i.op_str}\\n")
                              for x in ins[max(0,idx-35):idx+36]:
                                  f.write(f"  0x{x.address:X}: {x.mnemonic} {x.op_str}\\n")
                  f.write(f"refs={found}\\n")

          # Report all literal SysEx markers with surrounding bytes from the raw EXE.
          with (out/"sysex_byte_regions.txt").open("w") as f:
              pats=[b"\\xF0",b"\\xF7",b"\\xE0\\x00\\x00\\x00",b"\\x00\\x00\\x00\\xE0"]
              for p in pats:
                  positions=[];pos=0
                  while True:
                      q=data.find(p,pos)
                      if q<0: break
                      positions.append(q);pos=q+1
                  f.write(f"PATTERN {p.hex()} count={len(positions)}\\n")
                  for q in positions[:300]:
                      lo=max(0,q-32);hi=min(len(data),q+128)
                      f.write(f"0x{q:X}: {data[lo:hi].hex(' ')}\\n")

          # Resolve WINMM IAT and dump callers of MIDI APIs.
          targets={}
          try:
              for e in pe.DIRECTORY_ENTRY_IMPORT:
                  dll=e.dll.decode(errors="ignore")
                  if dll.upper()=="WINMM.DLL":
                      for x in e.imports:
                          nm=x.name.decode(errors="ignore") if x.name else ""
                          if "midi" in nm.lower():
                              targets[nm]=x.address
          except Exception: pass
          with (out/"midi_api_callers.txt").open("w") as f:
              for nm,t in targets.items():
                  f.write(f"\\n### {nm} IAT=0x{t:X}\\n")
                  for idx,i in enumerate(ins):
                      if i.mnemonic=="call":
                          target=None
                          for op in i.operands:
                              if op.type==CS_OP_MEM and op.mem.base==X86_REG_RIP:
                                  target=i.address+i.size+op.mem.disp
                          if target==t:
                              f.write(f"CALL 0x{i.address:X} -> {nm}\\n")
                              for x in ins[max(0,idx-25):idx+26]:
                                  f.write(f"  0x{x.address:X}: {x.mnemonic} {x.op_str}\\n")

          print("deep analysis complete")
          PY
          python3 deep.py
\n      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: mupgrade-full-analysis
          path: analysis/
          if-no-files-found: error
