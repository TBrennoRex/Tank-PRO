name: Static M-UPGRADE analysis

on:
  push:
    branches:
      - "analysis/mupgrade-static"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, shutil
          z=zipfile.ZipFile("M-UPGRADE_CORE.zip")
          out=Path("extracted")
          if out.exists(): shutil.rmtree(out)
          out.mkdir()
          for info in z.infolist():
              safe=info.filename.replace("\\","/")
              target=out/safe
              target.parent.mkdir(parents=True, exist_ok=True)
              if not info.is_dir():
                  target.write_bytes(z.read(info))
          print("Extracted", len(z.infolist()), "entries")
          PY
          find extracted -maxdepth 4 -type f -printf '%p %s bytes\n' | sort > file_list.txt

      - name: Analyze EXE and logs
        run: |
          python3 -m pip install --disable-pip-version-check pefile capstone
          cat > analyze.py <<'PY'
          from pathlib import Path
          import re, hashlib, pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32, CS_MODE_64

          root=Path("extracted")
          exe=root/"M-UPGRADE.exe"
          out=Path("analysis")
          out.mkdir(parents=True, exist_ok=True)
          data=exe.read_bytes()

          (out/"hashes.txt").write_text(
              f"size={len(data)}\nSHA256={hashlib.sha256(data).hexdigest()}\nMD5={hashlib.md5(data).hexdigest()}\n",
              encoding="utf-8")

          def ascii_strings(b, n=4):
              return [(m.start(),m.group().decode("ascii","ignore"))
                      for m in re.finditer(rb"[ -~]{%d,}" % n,b)]

          def utf16_strings(b,n=4):
              pat=rb"(?:[ -~]\\x00){%d,}" % n
              ans=[]
              for m in re.finditer(pat,b):
                  try: ans.append((m.start(),m.group().decode("utf-16le","ignore")))
                  except Exception: pass
              return ans

          astr=ascii_strings(data)
          ustr=utf16_strings(data)

          with (out/"strings_all.txt").open("w",encoding="utf-8",errors="ignore") as f:
              for off,s in astr: f.write(f"ASCII 0x{off:X} {s}\n")
              for off,s in ustr: f.write(f"UTF16 0x{off:X} {s}\n")

          key=re.compile(
              r"midi|sysex|sys\\s*ex|ota|upgrade|firmware|KPT|TANK|PRO|Sinco|"
              r"E0000000|000000E0|midiOut|midiIn|longmsg|shortmsg|ack|nak|"
              r"checksum|crc|verify|boot|loader|dfu|device|Qt",
              re.I)

          with (out/"strings_relevant.txt").open("w",encoding="utf-8",errors="ignore") as f:
              for off,s in astr+ustr:
                  if key.search(s): f.write(f"0x{off:X}\t{s}\n")

          pats={
              "E0000000_LE":bytes.fromhex("00 00 00 E0"),
              "E0000000_BE":bytes.fromhex("E0 00 00 00"),
              "midi":b"MIDI","sysex":b"SysEx","sinco":b"Sinco",
              "kpt":b"KPT","ota":b"OTA","upgrade":b"upgrade"
          }
          with (out/"byte_hits.txt").open("w") as f:
              for name,p in pats.items():
                  hits=[]; pos=0
                  while True:
                      pos=data.find(p,pos)
                      if pos<0: break
                      hits.append(pos); pos+=1
                  f.write(name+" count="+str(len(hits))+" "+" ".join(hex(x) for x in hits[:300])+"\n")

          pe=pefile.PE(str(exe),fast_load=False)
          with (out/"pe_report.txt").open("w",encoding="utf-8",errors="ignore") as f:
              f.write(f"Machine=0x{pe.FILE_HEADER.Machine:X}\n")
              f.write(f"ImageBase=0x{pe.OPTIONAL_HEADER.ImageBase:X}\n")
              f.write(f"EntryPointRVA=0x{pe.OPTIONAL_HEADER.AddressOfEntryPoint:X}\n")
              f.write("Sections:\n")
              for s in pe.sections:
                  name=s.Name.rstrip(b"\\0").decode(errors="ignore")
                  f.write(f"{name}\tVA=0x{s.VirtualAddress:X}\tVSZ=0x{s.Misc_VirtualSize:X}\tRAW=0x{s.PointerToRawData:X}\tRSZ=0x{s.SizeOfRawData:X}\n")
              f.write("\nImports:\n")
              try:
                  for entry in pe.DIRECTORY_ENTRY_IMPORT:
                      dll=entry.dll.decode(errors="ignore")
                      f.write(f"[{dll}]\n")
                      for imp in entry.imports:
                          nm=imp.name.decode(errors="ignore") if imp.name else f"ord_{imp.ordinal}"
                          f.write(f"  {nm}\n")
              except Exception as e: f.write("IMPORT_ERROR "+repr(e)+"\n")

          # Exported/imported symbols and strings are sufficient for first-pass protocol discovery.
          with (out/"import_filter.txt").open("w",encoding="utf-8") as f:
              try:
                  for entry in pe.DIRECTORY_ENTRY_IMPORT:
                      dll=entry.dll.decode(errors="ignore")
                      for imp in entry.imports:
                          nm=imp.name.decode(errors="ignore") if imp.name else ""
                          if re.search(r"midi|winmm|setupapi|hid|usb|serial|winusb|qt6serial|qt6core",dll+" "+nm,re.I):
                              f.write(f"{dll}\t{nm}\n")
              except Exception as e: f.write(repr(e))

          logs=[]
          for p in root.rglob("*.log"):
              try: t=p.read_text("utf-8","replace")
              except Exception: t=p.read_text(errors="replace")
              logs.append((p,t))

          lk=re.compile(r"midi|sysex|ota|upgrade|firmware|KPT|TANK|E000|Sinco|"
                        r"error|fail|success|ack|nak|checksum|verify|timeout|device|version|boot",re.I)
          with (out/"logs_relevant.txt").open("w",encoding="utf-8",errors="ignore") as f:
              for p,t in logs:
                  f.write("\n===== "+str(p)+" =====\n")
                  lines=t.splitlines()
                  for i,line in enumerate(lines):
                      if lk.search(line):
                          for j in range(max(0,i-2),min(len(lines),i+3)):
                              f.write(f"{j+1:6d}: {lines[j]}\n")

          # Extract likely URL/device/protocol configuration strings from AppConfig.ini.
          cfg=root/"AppConfig.ini"
          if cfg.exists():
              (out/"AppConfig.txt").write_text(cfg.read_text("utf-8","replace"),encoding="utf-8")

          print("Analysis complete")
          PY
          python3 analyze.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: mupgrade-static-analysis
          path: |
            file_list.txt
            analysis/
          if-no-files-found: error
