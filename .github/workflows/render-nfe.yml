name: Render NF-e PDF

on:
  push:
    paths:
      - "Documento de 🅱️.pdf"
      - ".github/workflows/render-nfe.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render PDF pages and extract text
        run: |
          python -m pip install --disable-pip-version-check pymupdf
          mkdir -p nfe-render
          python - <<'PY'
          import fitz, pathlib
          pdf = pathlib.Path("Documento de 🅱️.pdf")
          out = pathlib.Path("nfe-render")
          doc = fitz.open(pdf)
          for i, page in enumerate(doc, 1):
              pix = page.get_pixmap(matrix=fitz.Matrix(2.5, 2.5), alpha=False)
              pix.save(out / f"page-{i:02d}.png")
          text = "\n\n".join(f"--- PAGE {i} ---\n{p.get_text()}" for i, p in enumerate(doc, 1))
          (out / "extracted-text.txt").write_text(text, encoding="utf-8")
          print(f"Rendered {len(doc)} page(s)")
          PY

      - name: Upload rendered pages
        uses: actions/upload-artifact@v4
        with:
          name: nfe-render
          path: nfe-render/
          if-no-files-found: error
